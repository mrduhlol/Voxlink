<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Page not found · Voxlink</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="Voxlink home">
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="currentColor"/>
          <path d="M16 8C11.5817 8 8 11.5817 8 16C8 20.4183 11.5817 24 16 24C20.4183 24 24 20.4183 24 16C24 11.5817 20.4183 8 16 8ZM16 22C12.6863 22 10 19.3137 10 16C10 12.6863 12.6863 10 16 10C19.3137 10 22 12.6863 22 16C22 19.3137 19.3137 22 16 22Z" fill="white"/>
          <path d="M16 13V19M13 16H19" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Voxlink</span>
      </a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-16) var(--container-padding);">
    <div style="text-align: center; max-width: 400px;">
      <h1 style="font-size: 6rem; font-weight: 800; line-height: 1; color: var(--color-fg-subtle); margin-bottom: var(--space-4);">404</h1>
      <h2 style="font-size: var(--fs-2xl); font-weight: 700; color: var(--color-fg); margin-bottom: var(--space-4);">Page not found</h2>
      <p style="color: var(--color-fg-muted); margin-bottom: var(--space-8); line-height: var(--lh-relaxed);">The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="btn btn--primary btn--large">Go back home</a>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer-copy">Voxlink v0.2.0 — <a href="https://github.com/mrduhlol/Voxlink" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>
</body>
</html>
